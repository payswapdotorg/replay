<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Replay Calibration Page</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh;
         display: flex; flex-direction: column; align-items: center; gap: 28px;
         padding: 60px 20px; box-sizing: border-box; }
  h1 { font-size: 24px; margin: 0; }
  #clock { font-size: 30px; font-variant-numeric: tabular-nums; }
  #btn-center { font-size: 20px; padding: 20px 48px; }
  #btn-corner { position: fixed; left: 100px; bottom: 60px; font-size: 16px; padding: 14px 24px; }
  #btn-topleft { position: fixed; left: 100px; top: 100px; font-size: 16px; padding: 14px 24px; }
  input { font-size: 18px; padding: 12px; width: 340px; }
  #status { font-size: 20px; font-weight: 600; }
  .hint { color: #666; }
</style>
</head>
<body>
  <h1>Replay Calibration Page</h1>
  <div id="clock">--:--:--</div>
  <button id="btn-center">CLICK ME (CENTER)</button>
  <input id="inp" placeholder="type into the page, text shows below" aria-label="test input">
  <div id="status" aria-live="polite">clicks: 0</div>
  <p class="hint">Buttons at top-left and bottom-left corners verify coordinate mapping.</p>
  <button id="btn-topleft">TOP-LEFT BUTTON</button>
  <button id="btn-corner">BOTTOM-LEFT BUTTON</button>
<script>
  let n = 0;
  setInterval(() => {
    document.getElementById('clock').textContent = new Date().toLocaleTimeString();
  }, 250);
  document.getElementById('btn-center').addEventListener('click', () => {
    n++; document.getElementById('status').textContent = 'CLICKS: ' + n;
  });
  document.getElementById('btn-topleft').addEventListener('click', () => {
    n += 10; document.getElementById('status').textContent = 'TOP-LEFT HIT: ' + n;
  });
  document.getElementById('btn-corner').addEventListener('click', () => {
    n += 100; document.getElementById('status').textContent = 'BOTTOM-LEFT HIT: ' + n;
  });
  document.getElementById('inp').addEventListener('input', (e) => {
    document.getElementById('status').textContent = 'TYPED: ' + e.target.value;
  });
</script>
</body>
</html>
